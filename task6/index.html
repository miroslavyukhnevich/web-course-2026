<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Змейка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <div class="hud">
      <span class="hud-item">Счёт <strong id="score">0</strong></span>
      <span class="hud-item">Рекорд <strong id="best">0</strong></span>
    </div>

    <div class="canvas-wrap">
      <canvas id="game" width="400" height="400"></canvas>

      <!-- Меню старта -->
      <div id="startMenu" class="overlay">
        <div class="overlay-card">
          <p class="over-title">Змейка</p>
          <p class="over-sub">Собери как можно больше яблок</p>

          <div class="keys">
            <div class="keys-row">
              <span class="key">W</span>
            </div>
            <div class="keys-row">
              <span class="key">A</span>
              <span class="key">S</span>
              <span class="key">D</span>
            </div>
            <p class="keys-label">или стрелки</p>
          </div>

          <button id="startBtn" class="btn-primary" type="button">Играть</button>
        </div>
      </div>

      <!-- Проигрыш -->
      <div id="gameOverMenu" class="overlay hidden">
        <div class="overlay-card">
          <p class="over-title over-title--danger">Игра окончена</p>
          <p class="over-score">Счёт <strong id="finalScore">0</strong></p>
          <p class="over-score">Рекорд <strong id="finalBest">0</strong></p>
          <button id="restartBtn" class="btn-primary" type="button">Заново</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
